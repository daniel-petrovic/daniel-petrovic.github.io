title: Daniel Petrovic
description: Senior Embedded Linux & Modern C++ Consultant — Building robust Linux-based embedded software for complex products and platforms with Yocto, Qt6, OPC UA, and modern C++.
url: https://daniel-petrovic.github.io
baseurl: ""
markdown: kramdown
permalink: /blog/:title/
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

exclude:
  - README.md
  - vendor
