title: Daniel Petrovic
description: Embedded C++ consulting for industrial and medical systems — Yocto, Qt6, OPC UA, and modern C++ for Linux devices.
url: https://daniel-petrovic.github.io
baseurl: ""
markdown: kramdown
permalink: /blog/:title/
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

exclude:
  - README.md
  - vendor
