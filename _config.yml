title: Reliable software, shipped pragmatically.
description: Software engineering for embedded systems, network applications, industrial automation, and process-engineering software.
url: https://daniel-petrovic.github.io
baseurl: ""
# Public Formspree ID only; configure the recipient privately in Formspree.
formspree_form_id: "xyeyrrlb"
markdown: kramdown
permalink: /blog/:title/
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

exclude:
  - README.md
  - tests
  - vendor
