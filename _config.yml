title: Senior Embedded Linux & C++ Consultant
description: Embedded Linux and modern C++ for embedded products, with Qt6/QML applications and Yocto-based systems when needed.
url: https://daniel-petrovic.github.io
baseurl: ""
markdown: kramdown
permalink: /blog/:title/
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

exclude:
  - README.md
  - vendor
