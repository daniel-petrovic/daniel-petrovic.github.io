<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%26%23x2699%3B%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Alegreya+SC:wght@500;700&family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body{% if page.layout == 'post' %} class="post-page"{% endif %}>
    <div class="site-shell">
      <header class="site-header">
        <div class="container site-header-inner">
          <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
          <nav aria-label="Primary">
            <ul class="nav-list">
              <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
              <li><a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a></li>
              <li><a href="{{ '/cv/' | relative_url }}"{% if page.url == '/cv/' %} aria-current="page"{% endif %}>CV</a></li>
              <li><a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' or page.layout == 'post' %} aria-current="page"{% endif %}>Blog</a></li>
              <li><a href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a></li>
            </ul>
          </nav>
        </div>
      </header>

      <main class="container page-content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <div class="container site-footer-inner">
          <p><a href="{{ '/contact/' | relative_url }}">Contact</a></p>
          <p><a href="https://github.com/daniel-petrovic">GitHub</a></p>
        </div>
      </footer>
    </div>
  </body>
</html>
